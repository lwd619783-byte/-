name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-financial-test.txt
            requirements-announcement-provider.txt
            requirements-provider-observability-test.txt
            scripts/requirements-market-regime-csrc.txt

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Typecheck Node-only Local Core
        run: npm run local:typecheck

      - name: Compile frozen V1 contracts and check registry invariants
        run: npm run contracts:validate

      - name: Test V1 contracts offline
        run: npm run test:contracts

      - name: Test Local Core with isolated temporary databases
        run: npm run test:local-core

      - name: Install minimal provider-test dependencies
        run: python -m pip install -r requirements-financial-test.txt -r requirements-announcement-provider.txt -r requirements-provider-observability-test.txt

      - name: Test financial provider offline
        run: npm run test:financials:a

      - name: Validate committed financial artifacts
        run: npm run data:validate:financials:a

      - name: Test announcement provider offline
        run: npm run test:announcements:a

      - name: Validate committed announcement artifacts
        run: npm run data:validate:announcements:a

      - name: Test company-guidance expectation provider offline
        run: npm run test:expectations:company-guidance

      - name: Check committed company-guidance artifacts against announcement source
        run: node scripts/generate-company-guidance-expectations.mjs --check

      - name: Validate committed company-guidance expectation artifacts
        run: npm run data:validate:expectations:company-guidance

      - name: Test institution-consensus source probe offline
        run: npm run test:expectations:institution-consensus-probe

      - name: Test provider observability offline
        run: npm run test:provider-observability

      - name: Test Market Regime observation catalog offline
        run: npm run test:market-regime:catalog

      - name: Test Market Regime historical dataset offline
        run: npm run test:market-regime:historical

      - name: Test Market Regime PBC historical dataset offline
        run: npm run test:market-regime:pbc

      - name: Install isolated CSRC schema-probe dependency
        run: python -m pip install -r scripts/requirements-market-regime-csrc.txt

      - name: Test CSRC attachment inventory and schema probe offline
        run: npm run test:market-regime:csrc-c1

      - name: Test SSE historical market source offline
        run: npm run test:market-regime:sse

      - name: Test SZSE historical market source offline
        run: npm run test:market-regime:szse

      - name: Test BSE historical market source offline
        run: npm run test:market-regime:bse

      - name: Test all-A aggregation and D2 admission offline
        run: npm run test:market-regime:all-a

      - name: Validate committed D2 report against frozen D1 inventories offline
        run: npm run data:validate:market-regime:all-a

      - name: Build and validate deterministic Market Regime sample catalog
        run: npm run data:build:market-regime:catalog && npm run data:validate:market-regime:catalog

      - name: Run data authenticity audit
        run: npm run data:audit

      - name: Run unit tests
        run: npm run test

      - name: Verify test discovery with isolated nested checkout fixtures
        run: npm run test:discovery

      - name: Build and enforce data bundle budgets
        run: npm run build
