<p>12月末，广义货币(M2)余额167.68万亿元,同比增长8.2%，增速分别比上月末和上年同期低0.9个和3.1个百分点；狭义货币(M1)余额54.38万亿元,同比增长11.8%，增速分别比上月末和上年同期低0.9个和9.6个百分点；流通中货币(M0)余额7.06万亿元,同比增长3.4%。全年净投放现金2342亿元。</p>
