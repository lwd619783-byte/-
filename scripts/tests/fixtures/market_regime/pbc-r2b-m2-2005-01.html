            <td class="hui12" align="right">
             <!--2005年02月17日--><span id="shijian">2005-02-17 14:06:00</p>
<p style="text-indent:27.0pt">货币供应量M2增长平稳。1月末广义货币M2余额为25.78万亿元，同比增长14.1%，增幅比上年12月末低0.5个百分点，比上年同期低4个百分点。狭义货币M1余额为 9.7万亿元，同比增长15.3 %，比上年12月末高1.7个百分点，比上年同期低0.4个百分点。消除季节因素后，1月末广义货币供应量M2月环比折年率为16.3%。</p>
